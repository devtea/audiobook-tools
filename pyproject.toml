[project]
name = "audiobook-tools"
version = "0.1.0"
description = "Misc python audiobook tools and utilities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "mutagen>=1.47.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "ipython>=9.9.0",
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# util/, subcommands/ and audiobook_tools.py are top-level modules at the repo root.
pythonpath = ["."]
